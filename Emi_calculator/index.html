<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Loan EMI Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="calculator">

        <!-- Loan Amount -->
        <div class="input-section">

            <div class="row">
                <label>Loan amount</label>

                <div class="value-box">
                    ₹ <span id="loanAmountValue">10,00,000</span>
                </div>
            </div>

            <input
                type="range"
                id="loanAmount"
                min="100000"
                max="5000000"
                step="50000"
                value="1000000"
            >

        </div>


        <!-- Rate of Interest -->
        <div class="input-section">

            <div class="row">
                <label>Rate of interest (p.a)</label>

                <div class="value-box">
                    <span id="interestValue">6.5</span> %
                </div>
            </div>

            <input
                type="range"
                id="interestRate"
                min="1"
                max="20"
                step="0.1"
                value="6.5"
            >

        </div>


        <!-- Loan Tenure -->
        <div class="input-section">

            <div class="row">
                <label>Loan tenure</label>

                <div class="value-box">
                    <span id="tenureValue">5</span> Yr
                </div>
            </div>

            <input
                type="range"
                id="loanTenure"
                min="1"
                max="30"
                step="1"
                value="5"
            >

        </div>


        <!-- Results -->
        <div class="results">

            <div class="result-row">
                <span>Monthly EMI</span>
                <strong id="monthlyEmi">₹19,566</strong>
            </div>

            <div class="result-row">
                <span>Principal amount</span>
                <strong id="principalAmount">₹10,00,000</strong>
            </div>

            <div class="result-row">
                <span>Total interest</span>
                <strong id="totalInterest">₹1,73,969</strong>
            </div>

            <div class="result-row">
                <span>Total amount</span>
                <strong id="totalAmount">₹11,73,969</strong>
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
